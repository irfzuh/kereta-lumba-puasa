    function stopCelebration(){
      if(confettiRaf){ cancelAnimationFrame(confettiRaf); confettiRaf = 0; }
      confettiPieces = [];
      const fl = $(&quot;lkr-victory-flash&quot;), cc = $(&quot;lkr-confetti&quot;);
      if(fl){ fl.className = &quot;lkr-victory-flash&quot;; fl.style.background = &quot;&quot;; }
      if(cc){ cc.className = &quot;&quot;; const cctx = cc.getContext(&quot;2d&quot;); if(cctx) cctx.clearRect(0,0,cc.width,cc.height); }
    }

    function startCelebration(diffKey){
      stopCelebration();
      const meta = TROPHY_META[diffKey] || TROPHY_META.medium;
      const fl = $(&quot;lkr-victory-flash&quot;), cc = $(&quot;lkr-confetti&quot;), app = $(&quot;lkr-app&quot;);
      if(fl){ fl.style.background = meta.flash; fl.className = &quot;lkr-victory-flash show&quot;; }
      if(!cc || !app) return;
      const cctx = cc.getContext(&quot;2d&quot;); if(!cctx) return;
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      const w = app.clientWidth || 640, h = app.clientHeight || 500;
      cc.width = Math.floor(w * dpr); cc.height = Math.floor(h * dpr);
      cctx.setTransform(dpr,0,0,dpr,0,0);
      cc.className = &quot;show&quot;;
      function burst(n, yRatio){
        for(let i=0;i<n;i++){
          const left = i % 2 === 0;
          const ox = left ? w * (0.15 + Math.random()*0.25) : w * (0.6 + Math.random()*0.25);
          const ang = -Math.PI/2 + (Math.random()-0.5)*1.15;
          const spd = 4.6 + Math.random()*7.8;
          confettiPieces.push({
            x:ox, y:h*yRatio, vx:Math.cos(ang)*spd, vy:Math.sin(ang)*spd-1.2,
            s:5+Math.random()*5.5, a:0.45+Math.random()*0.55, r:Math.random()*6.28, vr:(Math.random()-0.5)*0.22,
            c:meta.palette[i % meta.palette.length], al:1, sw:Math.random()*6.28
          });
        }
      }
      burst(80, 0.56);
      setTimeout(function(){ if(state.view===&quot;summary&quot;) burst(60, 0.34); }, 450);
      const t0 = performance.now();
      function stepConfetti(now){
        const el = now - t0;
        cctx.clearRect(0,0,w,h);
        for(let i=confettiPieces.length-1;i>=0;i--){
          const p = confettiPieces[i];
          p.sw += 0.08; p.vx *= 0.99; p.vy += 0.16; p.x += p.vx + Math.sin(p.sw)*0.65; p.y += p.vy; p.r += p.vr;
          if(el > 3100) p.al = Math.max(0, p.al - 0.02);
          if(p.al <= 0 || p.y > h + 24){ confettiPieces.splice(i,1); continue; }
          cctx.save(); cctx.globalAlpha = p.al; cctx.translate(p.x,p.y); cctx.rotate(p.r);
          cctx.fillStyle = p.c; cctx.fillRect(-p.s/2, -p.s*p.a/2, p.s, p.s*p.a); cctx.restore();
        }
        if(confettiPieces.length > 0 &amp;&amp; el < 5400 &amp;&amp; state.view === &quot;summary&quot;){
          confettiRaf = requestAnimationFrame(stepConfetti);
        } else {
          cctx.clearRect(0,0,w,h);
          confettiRaf = 0;
        }
      }
      confettiRaf = requestAnimationFrame(stepConfetti);
    }

    const canvas = $(&quot;lkr-canvas&quot;), ctx = canvas.getContext(&quot;2d&quot;), particles = [];
    let tick = 0, lastTs = performance.now();

    function drawCar(x, y, isPlayer, speed, carId, sunsetProgress){
      const isNitro = isPlayer &amp;&amp; state.status===&quot;nitro&quot;;
      const isStopped = isPlayer &amp;&amp; state.status===&quot;stopped&quot;;
      let nx=0, ny=0, tilt=0;
      if(isNitro){
        if(carId===&quot;car-gt&quot;){ ny=Math.sin(tick*0.28)*2.4; tilt=-0.07+Math.sin(tick*0.45)*0.028; }
        else if(carId===&quot;car-drift&quot;){ nx=4; tilt=-0.055; }
        else if(carId===&quot;car-ferrari&quot;){ nx=Math.sin(tick*0.5)*3.8+3; tilt=-0.04; }
        else if(carId===&quot;car-hyper&quot;){ nx=Math.cos(tick*1.1)*1.4; ny=Math.sin(tick*1.2)*1.8; tilt=-0.065; }
      }
      ctx.save(); ctx.translate(x+nx, y+ny);
      ctx.scale(isPlayer?1.16:0.98, isPlayer?1.16:0.98);
      ctx.translate(0, speed>5 ? Math.sin(tick*0.35)*(isNitro?1.7:0.85) : 0);
      if(tilt!==0) ctx.rotate(tilt);

      ctx.fillStyle = &quot;rgba(0,0,0,0.38)&quot;; ctx.beginPath(); ctx.ellipse(0,18,48,8,0,0,Math.PI*2); ctx.fill();

      if(isNitro){
        ctx.save(); ctx.globalCompositeOperation=&quot;lighter&quot;;
        if(carId===&quot;car-gt&quot;){
          const ug=ctx.createLinearGradient(-42,13,44,13);
          ug.addColorStop(0,&quot;rgba(34,211,238,0.8)&quot;); ug.addColorStop(0.5,&quot;rgba(56,189,248,0.9)&quot;); ug.addColorStop(1,&quot;rgba(34,211,238,0.25)&quot;);
          ctx.fillStyle=ug; ctx.beginPath(); ctx.ellipse(0,15,44,5,0,0,Math.PI*2); ctx.fill();
        } else if(carId===&quot;car-drift&quot;){
          for(let r=0;r<3;r++){
            const wp=(tick*0.14+r*0.33)%1;
            ctx.strokeStyle=&quot;rgba(56,189,248,&quot;+((1-wp)*0.72)+&quot;)&quot;; ctx.lineWidth=2.2;
            ctx.beginPath(); ctx.arc(28-wp*88,-4,18+wp*18,Math.PI*0.65,Math.PI*1.35); ctx.stroke();
          }
        } else if(carId===&quot;car-ferrari&quot;){
          ctx.strokeStyle=&quot;rgba(239,68,68,0.75)&quot;; ctx.lineWidth=2;
          for(let s=0;s<3;s++){
            const sx=-42-((tick*6+s*14)%36);
            ctx.beginPath(); ctx.moveTo(sx,-14+s*10); ctx.lineTo(sx-26,-14+s*10); ctx.stroke();

    function loop(now){
      tick++;
      const dt = Math.min(0.05, (now-lastTs)/1000); lastTs = now;
      if(state.active){
        if(state.status!==&quot;normal&quot;){
          state.statusTimer -= dt;
          if(state.statusTimer<=0){ state.status=&quot;normal&quot;; state.speed=BASE_SPEED; }
        }
        state.playerDist += state.speed*SPEED_TO_MPS*dt;
        state.bgOffset += state.speed*dt*4.2;
        state.aiDist += DIFF_CFG[state.diff].ai*SPEED_TO_MPS*dt;
        state.timeRem = Math.max(0, state.timeRem-dt);
        updateAudio(now);

        const pPct = Math.min(100, (state.playerDist/FINISH_DIST)*100);
        const aPct = Math.min(100, (state.aiDist/FINISH_DIST)*100);
        $(&quot;hud-time&quot;).textContent = state.timeRem.toFixed(1)+&quot;s&quot;;
        $(&quot;hud-time&quot;).className = state.timeRem <= 12 ? &quot;urgent&quot; : &quot;&quot;;
        $(&quot;hud-speed&quot;).textContent = Math.round(state.speed)+&quot; km/j&quot;;
        $(&quot;hud-dist&quot;).textContent = Math.round(state.playerDist)+&quot;m / &quot;+Math.round(state.aiDist)+&quot;m&quot;;
        $(&quot;hud-streak&quot;).textContent = state.streak + &quot;x&quot;;
        $(&quot;hud-streak&quot;).className = state.streak >= 2 ? &quot;lkr-streak show&quot; : &quot;lkr-streak&quot;;
        $(&quot;prog-pl&quot;).style.width = pPct.toFixed(1) + &quot;%&quot;;
        $(&quot;prog-ai&quot;).style.width = aPct.toFixed(1) + &quot;%&quot;;
        $(&quot;prog-pct&quot;).textContent = Math.round(pPct) + &quot;%&quot;;
        updatePlayBadges();

        if(state.playerDist>=FINISH_DIST) finishRace(&quot;player&quot;);
        else if(state.aiDist>=FINISH_DIST) finishRace(&quot;ai&quot;);
        else if(state.timeRem<=0) finishRace(&quot;sunset&quot;);
      }

      if(state.view===&quot;play&quot;){
        const dpr = Math.min(window.devicePixelRatio||1, 2), w=canvas.clientWidth, h=canvas.clientHeight;
        if(w>0 &amp;&amp; h>0){
          if(canvas.width!==Math.floor(w*dpr) || canvas.height!==Math.floor(h*dpr)){
            canvas.width=Math.floor(w*dpr); canvas.height=Math.floor(h*dpr); ctx.setTransform(dpr,0,0,dpr,0,0);
          }
          const sp=Math.max(0,Math.min(1,1-state.timeRem/Math.max(1,state.totalTime))), hy=h*0.54;

          const skyTop = lerpColor([30,41,78],[10,12,30],sp);
          const skyMid = lerpColor([217,119,6],[76,29,149],Math.pow(sp,0.85));
          const skyBot = lerpColor([253,186,116],[194,65,12],sp);
          const sky=ctx.createLinearGradient(0,0,0,hy);
          sky.addColorStop(0,skyTop); sky.addColorStop(0.62,skyMid); sky.addColorStop(1,skyBot);
          ctx.fillStyle=sky; ctx.fillRect(0,0,w,hy+4);

          ctx.fillStyle=&quot;rgba(255,255,255,&quot;+Math.max(0.08,sp*0.9)+&quot;)&quot;;
          for(let s=0;s<28;s++){
            ctx.beginPath(); ctx.arc((s*137.5+40)%w, (s*53.3+18)%(hy*0.68), s%4===0?1.6:1, 0, Math.PI*2); ctx.fill();
          }

          const mx=w*0.84, my=h*0.14;

          ctx.fillStyle=&quot;#FDE68A&quot;; ctx.beginPath(); ctx.arc(mx,my,16,0,Math.PI*2); ctx.fill();
